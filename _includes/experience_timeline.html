<div class="experience-timeline">
  {% for exp in site.data.experience %}
  <div class="timeline-item{% if exp.current %} timeline-item--current{% endif %}">
    <div class="timeline-card">
      <div class="timeline-logo-wrap timeline-logo-wrap--{{ exp.organization | slugify }}">
        <img class="timeline-logo" src="{{ exp.logo }}" alt="{{ exp.organization }} logo">
      </div>
      <div class="timeline-info">
        <div class="timeline-role">{{ exp.role }}</div>
        <div class="timeline-affiliation">
          <span class="timeline-org">{{ exp.organization }}</span>
          <span class="timeline-location">{{ exp.location }}</span>
        </div>
      </div>
      <div class="timeline-period">
        <span class="timeline-dates">{{ exp.dates }}</span>
        {% if exp.current %}<span class="timeline-current">Current</span>{% endif %}
      </div>
    </div>
  </div>
  {% endfor %}
</div>
